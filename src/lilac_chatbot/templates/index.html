{% extends 'base.html' %}
{% block content %}
<section class="hero">
  <h1>Chat with Jessica</h1>
  <p>Questions about an order, a product or a delivery? Ask the Life in Lilac assistant.</p>

  {% endif %}
</section>
{% endblock %}
