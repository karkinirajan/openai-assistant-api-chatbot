[project]
name = "lilac-chatbot"
version = "0.1.0"
description = "Jessica, the Life in Lilac support chatbot: a Flask app whose replies come from the OpenAI Responses API with file search and a structured is_order / order_id / answer reply."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1",
    "flask-sqlalchemy>=3.1",
    "httpx>=0.28",
    "openai>=3.42",
    "pydantic>=2.10",
    "python-dotenv>=1.1",
    "gunicorn>=23",
]

[project.scripts]
lilac-chatbot = "lilac_chatbot.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-cov>=6", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lilac_chatbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["lilac_chatbot"]
branch = true

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S", "BLE", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108"]
